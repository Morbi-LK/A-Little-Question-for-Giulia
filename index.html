<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Question for Giulia 💗</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="hearts" aria-hidden="true"></div>

  <main class="card" id="card">
    <div class="sparkle">✦</div>

    <p class="eyebrow">A little question for Giulia</p>

    <h1>
      Baby,<br>
      <span>will you go on a date with me?</span> 💗
    </h1>

    <p class="intro">
      I would love to go out with you when I'm at your place
    </p>

    <div class="dates">
      <button class="date-option" data-date="October 7">October 7</button>
      <button class="date-option" data-date="October 8">October 8</button>
      <button class="date-option" data-date="October 9">October 9</button>
      <button class="date-option" data-date="October 10">October 10</button>
      <button class="date-option" data-date="October 11">October 11</button>
    </div>

    <p class="hint">
      Pick a day that you think would work
    </p>

    <div class="actions">
      <button class="yes-btn" id="yesBtn">
        YES, OF COURSE 💗
      </button>

      <button class="maybe-btn" id="maybeBtn">
        Let me think... 🌸
      </button>
    </div>

    <p class="selected" id="selected"></p>
  </main>

  <section class="success hidden" id="success">
    <div class="success-card">

      <div class="big-heart">💗</div>

      <p class="eyebrow">It's a date!</p>

      <h2>HELL YEAH 🥰</h2>

      <p id="successText">
        I think it's gonna be so much fun baby
      </p>

      <div class="mini-note">
        <span>♡</span>
        <span>7–11 October</span>
        <span>♡</span>
      </div>

      <button class="again-btn" id="againBtn">
        Back to the question
      </button>

    </div>
  </section>

  <script src="script.js"></script>

</body>
</html>
